name: Integration Test - Math CAPTCHA Plugin

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring
          coverage: none

      - name: Install dependencies
        run: composer install --no-progress

      - name: Run unit tests
        run: vendor/bin/phpunit tests/MathCaptchaTest.php

      - name: Run standalone integration checks
        run: |
          output=$(php tests/integration/IntegrationTest.php)
          echo "$output"
          # Guard against the script dying silently before any test runs
          echo "$output" | grep -q "Failed: 0" || exit 1

  integration-test:
    name: Integration Test
    runs-on: ubuntu-latest

    env:
      YOURLS_VERSION: '1.9.2'
      YOURLS_DIR: /tmp/yourls-test
      ADMIN_USER: test-admin
      ADMIN_PASS: test-password

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, mysqli, pdo_mysql, gd, curl
          coverage: none

      - name: Start MySQL
        run: |
          # MySQL comes preinstalled on ubuntu-latest runners (root/root)
          sudo systemctl start mysql.service
          mysql -uroot -proot -e "CREATE DATABASE yourls;"

      - name: Install YOURLS
        run: |
          wget -q "https://github.com/YOURLS/YOURLS/archive/refs/tags/${YOURLS_VERSION}.tar.gz" -O /tmp/yourls.tar.gz
          tar -xzf /tmp/yourls.tar.gz -C /tmp/
          mv "/tmp/YOURLS-${YOURLS_VERSION}" "${YOURLS_DIR}"

          # Install this plugin
          mkdir -p "${YOURLS_DIR}/user/plugins"
          cp -r "${GITHUB_WORKSPACE}/plugins/math-captcha" "${YOURLS_DIR}/user/plugins/math-captcha"

          echo "YOURLS prepared"

      - name: Create YOURLS config
        run: |
          cat > "${YOURLS_DIR}/user/config.php" << EOF
          <?php
          /* YOURLS configuration for integration testing */
          define( 'YOURLS_DB_USER', 'root' );
          define( 'YOURLS_DB_PASS', 'root' );
          define( 'YOURLS_DB_NAME', 'yourls' );
          define( 'YOURLS_DB_HOST', '127.0.0.1' );
          define( 'YOURLS_DB_PREFIX', 'yourls_' );
          define( 'YOURLS_SITE', 'http://localhost:8080' );
          define( 'YOURLS_HOURS_OFFSET', 0 );
          define( 'YOURLS_LANG', '' );
          define( 'YOURLS_UNIQUE_URLS', true );
          define( 'YOURLS_PRIVATE', true );
          define( 'YOURLS_COOKIEKEY', 'integration-test-cookie-key' );
          define( 'YOURLS_NO_HASH_PASSWORD', true );
          define( 'YOURLS_DEBUG', true );
          define( 'YOURLS_URL_CONVERT', 36 );
          \$yourls_user_passwords = [ '${ADMIN_USER}' => '${ADMIN_PASS}' ];
          \$yourls_reserved_URL = [ 'admin' ];
          date_default_timezone_set( 'UTC' );
          EOF

      - name: Install YOURLS database and activate plugin
        run: |
          cat > /tmp/install-yourls.php << 'EOF'
          <?php
          define( 'YOURLS_INSTALLING', true );
          require '/tmp/yourls-test/includes/load-yourls.php';
          require_once YOURLS_INC . '/functions-install.php';

          $result = yourls_create_sql_tables();
          print_r( $result );
          if ( ! empty( $result['error'] ) ) {
              exit( 1 );
          }

          yourls_update_option( 'active_plugins', array( 'math-captcha/plugin.php' ) );
          echo "Plugin activated\n";
          EOF
          php /tmp/install-yourls.php

          # Verify
          mysql -uroot -proot yourls -e "SHOW TABLES; SELECT option_name, option_value FROM yourls_options;"

      - name: Start PHP web server
        run: |
          # PHP's built-in server has no .htaccess support; emulate the YOURLS
          # rewrite rules: serve real files/dirs, send the rest to yourls-loader.php
          cat > "${YOURLS_DIR}/router.php" << 'EOF'
          <?php
          $path = parse_url( $_SERVER['REQUEST_URI'], PHP_URL_PATH );
          if ( $path !== '/' && file_exists( __DIR__ . $path ) ) {
              return false;
          }
          require __DIR__ . '/yourls-loader.php';
          EOF

          php -S localhost:8080 -t "${YOURLS_DIR}" "${YOURLS_DIR}/router.php" > /tmp/php-server.log 2>&1 &
          echo $! > /tmp/php-server.pid

          for i in {1..15}; do
            code=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8080/admin/ || true)
            if [ "$code" = "200" ]; then
              echo "Server is running"
              exit 0
            fi
            echo "waiting (last status: $code)..."
            sleep 1
          done

          echo "Server did not come up"
          tail -50 /tmp/php-server.log
          exit 1

      - name: Test admin page loads
        run: |
          curl -s -o /tmp/admin-anon.html http://localhost:8080/admin/
          grep -qi "YOURLS" /tmp/admin-anon.html && echo "Admin page loads" || { head -50 /tmp/admin-anon.html; exit 1; }

      - name: Log in and extract CAPTCHA question and nonce
        id: captcha
        run: |
          # The login form is CSRF-protected: fetch it first to get the login
          # nonce and the session cookie, then post the credentials with it.
          curl -s -c /tmp/cookies.txt -o /tmp/login.html http://localhost:8080/admin/
          login_nonce=$(grep -oP '<input[^>]*name="nonce"[^>]*>' /tmp/login.html | grep -oP 'value="\K[^"]+' | head -1)
          if [ -z "$login_nonce" ]; then
            echo "Could not find login nonce"
            head -80 /tmp/login.html
            exit 1
          fi

          # YOURLS answers a successful login with a redirect; the auth cookie
          # is in the jar afterwards, so fetch the admin page with a plain GET.
          curl -s -b /tmp/cookies.txt -c /tmp/cookies.txt \
            --data-urlencode "username=${ADMIN_USER}" \
            --data-urlencode "password=${ADMIN_PASS}" \
            --data-urlencode "nonce=${login_nonce}" \
            --data-urlencode "submit=submit" \
            -o /dev/null \
            http://localhost:8080/admin/

          curl -s -b /tmp/cookies.txt -c /tmp/cookies.txt \
            -o /tmp/admin.html \
            http://localhost:8080/admin/

          question=$(grep -oP '<span id="math-captcha-question">\s*\K[0-9]+ \+ [0-9]+' /tmp/admin.html || true)
          nonce=$(grep -oP '<input[^>]*nonce-add[^>]*>' /tmp/admin.html | grep -oP 'value="\K[^"]+' | head -1 || true)

          if [ -z "$question" ]; then
            echo "Could not find CAPTCHA question - is the plugin active?"
            echo "--- Admin page (first 80 lines) ---"
            head -80 /tmp/admin.html
            exit 1
          fi

          if [ -z "$nonce" ]; then
            echo "Could not find add-url nonce"
            grep -i "nonce" /tmp/admin.html || true
            exit 1
          fi

          num1=$(echo "$question" | awk '{print $1}')
          num2=$(echo "$question" | awk '{print $3}')
          answer=$((num1 + num2))

          echo "Found CAPTCHA: $question (answer: $answer)"
          echo "answer=$answer" >> "$GITHUB_OUTPUT"
          echo "nonce=$nonce" >> "$GITHUB_OUTPUT"

      - name: Submit URL with correct CAPTCHA
        run: |
          response=$(curl -s -b /tmp/cookies.txt -c /tmp/cookies.txt \
            --data-urlencode "action=add" \
            --data-urlencode "nonce=${{ steps.captcha.outputs.nonce }}" \
            --data-urlencode "url=https://github.com/MarcProe/simple-antispam" \
            --data-urlencode "keyword=test123" \
            --data-urlencode "title=Test URL" \
            --data-urlencode "math_captcha_answer=${{ steps.captcha.outputs.answer }}" \
            http://localhost:8080/admin/admin-ajax.php)

          echo "Response: $response"

          if echo "$response" | grep -q '"status":"success"'; then
            echo "URL shortened successfully"
          else
            echo "Expected successful add"
            exit 1
          fi

      - name: Verify short URL redirect
        run: |
          redirect=$(curl -s -o /dev/null -w "%{redirect_url}" http://localhost:8080/test123)
          echo "Short URL redirects to: $redirect"

          if echo "$redirect" | grep -q "github.com/MarcProe/simple-antispam"; then
            echo "Short URL works correctly"
          else
            echo "Short URL redirect failed"
            exit 1
          fi

      - name: Test wrong CAPTCHA
        run: |
          # Fresh session: log in again so a new CAPTCHA question is generated
          curl -s -c /tmp/cookies-wrong.txt -o /tmp/login-wrong.html http://localhost:8080/admin/
          login_nonce=$(grep -oP '<input[^>]*name="nonce"[^>]*>' /tmp/login-wrong.html | grep -oP 'value="\K[^"]+' | head -1)
          curl -s -b /tmp/cookies-wrong.txt -c /tmp/cookies-wrong.txt \
            --data-urlencode "username=${ADMIN_USER}" \
            --data-urlencode "password=${ADMIN_PASS}" \
            --data-urlencode "nonce=${login_nonce}" \
            --data-urlencode "submit=submit" \
            -o /dev/null \
            http://localhost:8080/admin/
          curl -s -b /tmp/cookies-wrong.txt -c /tmp/cookies-wrong.txt \
            -o /tmp/admin-wrong.html \
            http://localhost:8080/admin/

          nonce=$(grep -oP '<input[^>]*nonce-add[^>]*>' /tmp/admin-wrong.html | grep -oP 'value="\K[^"]+' | head -1)

          # 99999 can never be correct: operands are 1-99, so the max answer is 198
          response=$(curl -s -b /tmp/cookies-wrong.txt \
            --data-urlencode "action=add" \
            --data-urlencode "nonce=$nonce" \
            --data-urlencode "url=https://example.com/wrong" \
            --data-urlencode "keyword=wrongkw" \
            --data-urlencode "title=Wrong" \
            --data-urlencode "math_captcha_answer=99999" \
            http://localhost:8080/admin/admin-ajax.php)

          echo "Response: $response"

          if echo "$response" | grep -q "error:captcha_wrong"; then
            echo "Wrong CAPTCHA rejected"
          else
            echo "Expected CAPTCHA error"
            exit 1
          fi

      - name: Test missing CAPTCHA
        run: |
          curl -s -c /tmp/cookies-missing.txt -o /tmp/login-missing.html http://localhost:8080/admin/
          login_nonce=$(grep -oP '<input[^>]*name="nonce"[^>]*>' /tmp/login-missing.html | grep -oP 'value="\K[^"]+' | head -1)
          curl -s -b /tmp/cookies-missing.txt -c /tmp/cookies-missing.txt \
            --data-urlencode "username=${ADMIN_USER}" \
            --data-urlencode "password=${ADMIN_PASS}" \
            --data-urlencode "nonce=${login_nonce}" \
            --data-urlencode "submit=submit" \
            -o /dev/null \
            http://localhost:8080/admin/
          curl -s -b /tmp/cookies-missing.txt -c /tmp/cookies-missing.txt \
            -o /tmp/admin-missing.html \
            http://localhost:8080/admin/

          nonce=$(grep -oP '<input[^>]*nonce-add[^>]*>' /tmp/admin-missing.html | grep -oP 'value="\K[^"]+' | head -1)

          response=$(curl -s -b /tmp/cookies-missing.txt \
            --data-urlencode "action=add" \
            --data-urlencode "nonce=$nonce" \
            --data-urlencode "url=https://example.com/missing" \
            --data-urlencode "keyword=missingkw" \
            --data-urlencode "title=Missing" \
            http://localhost:8080/admin/admin-ajax.php)

          echo "Response: $response"

          if echo "$response" | grep -q "error:captcha_missing"; then
            echo "Missing CAPTCHA rejected"
          else
            echo "Expected missing CAPTCHA error"
            exit 1
          fi

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Install Playwright
        working-directory: tests/integration
        run: |
          npm install
          npx playwright install --with-deps chromium

      - name: Capture screenshots
        working-directory: tests/integration
        env:
          BASE_URL: http://localhost:8080
        run: |
          # Debug output would clutter the screenshots; the config is
          # re-read on every request, so no server restart is needed.
          sed -i "s/define( 'YOURLS_DEBUG', true );/define( 'YOURLS_DEBUG', false );/" "${YOURLS_DIR}/user/config.php"
          node screenshots.mjs

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: integration-test-screenshots
          path: tests/integration/screenshots/
          if-no-files-found: ignore
          retention-days: 30

      - name: Stop server
        if: always()
        run: |
          if [ -f /tmp/php-server.pid ]; then
            kill $(cat /tmp/php-server.pid) 2>/dev/null || true
          fi

      - name: Show logs on failure
        if: failure()
        run: |
          echo "=== Server Logs ==="
          tail -100 /tmp/php-server.log || true

          echo "=== Database ==="
          mysql -uroot -proot yourls -e "SHOW TABLES;" || true
          mysql -uroot -proot yourls -e "SELECT option_name, option_value FROM yourls_options;" || true
