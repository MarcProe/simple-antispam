# Manual test environment: real YOURLS + MySQL with the Math CAPTCHA plugin
# mounted. Bring it up, then finish the YOURLS install and activate the
# plugin in the browser:
#
#   docker compose up -d
#   open http://localhost:8080/admin/   (login: admin / password)
#
# On first run YOURLS asks you to install; afterwards activate
# "Math CAPTCHA" on the Plugins page. The plugin directory is the live
# repository checkout, so code changes are visible on reload.

services:
  mysql:
    image: mysql:8.0
    container_name: yourls-captcha-mysql
    environment:
      MYSQL_ROOT_PASSWORD: yourlspass
      MYSQL_DATABASE: yourls
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-pyourlspass"]
      interval: 5s
      timeout: 5s
      retries: 10

  yourls:
    image: yourls:1.9.2
    container_name: yourls-math-captcha-test
    ports:
      - "8080:80"
    environment:
      YOURLS_DB_HOST: mysql
      YOURLS_DB_USER: root
      YOURLS_DB_PASS: yourlspass
      YOURLS_DB_NAME: yourls
      YOURLS_SITE: http://localhost:8080
      YOURLS_USER: admin
      YOURLS_PASS: password
    volumes:
      - ../../:/var/www/html/user/plugins/math-captcha
    depends_on:
      mysql:
        condition: service_healthy
